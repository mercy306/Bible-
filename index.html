<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Holy Bible (መጽሐፍ ቅዱስ)</title>
    <meta name="description" content="Read and search all 66 books of the Holy Bible in Amharic and English, offline." />
    <meta name="theme-color" content="#08090A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="መጽሐፍ ቅዱስ" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <style>
      body {
        margin: 0;
        background-color: #08090A;
      }
      @keyframes initialProgress {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(0%); }
        100% { transform: translateX(100%); }
      }
      @keyframes initialPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loading" style="position:fixed;inset:0;background:#08090A;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:system-ui,-apple-system,sans-serif;z-index:99999;user-select:none;-webkit-user-select:none;padding:24px;box-sizing:border-box;">
        <div style="position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);width:260px;height:260px;background:radial-gradient(circle,rgba(197,160,89,0.18) 0%,transparent 70%);border-radius:50%;pointer-events:none;animation:initialPulse 2.4s ease-in-out infinite;"></div>
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;max-width:320px;width:100%;padding:32px 24px 24px;background:rgba(18,21,26,0.75);border:1px solid rgba(255,255,255,0.08);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,0.8);">
          <div style="position:relative;margin-bottom:20px;display:inline-block;">
            <img src="/bible-closed-cross.png" alt="The Holy Bible" style="display:block;width:155px;height:auto;max-width:70vw;filter:drop-shadow(0 16px 36px rgba(0,0,0,0.65));" />
          </div>
          <h1 style="margin:0;font-size:26px;font-weight:700;color:#FFFFFF;letter-spacing:0.02em;">መጽሐፍ ቅዱስ</h1>
          <div style="font-size:11px;font-weight:600;letter-spacing:0.22em;color:#C5A059;text-transform:uppercase;margin-top:5px;">THE HOLY BIBLE</div>
          <div style="font-size:10px;font-weight:500;letter-spacing:0.12em;color:#7A8191;text-transform:uppercase;margin-top:4px;">ብሉይና ሐዲስ ኪዳን • 66 BOOKS</div>
          <div style="width:84px;height:2px;background:rgba(255,255,255,0.08);border-radius:999px;margin-top:20px;overflow:hidden;position:relative;">
            <div style="height:100%;width:100%;background:linear-gradient(90deg,transparent 0%,#C5A059 50%,#F4E8C1 100%);border-radius:999px;animation:initialProgress 1.4s infinite ease-in-out;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
